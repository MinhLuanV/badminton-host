<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="apple-touch-icon" href="icon.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1e3a8a">
    <title>Badminton Host</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Segoe UI,sans-serif;
        }

        body {
            background: linear-gradient(to bottom,#1e3a8a,#2563eb);
            color: white;
            min-height: 100vh;
        }

        .container {
            padding: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo {
            font-size: 38px;
            font-weight: 700;
        }
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1e293b;
            color: white;
            padding: 14px 22px;
            border-radius: 14px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 9999;
            border: 1px solid #24345d;
        }

        #toast.show {
            opacity: 1;
            top: 40px;
        }

        .sub {
            color: #94a3b8;
            margin-top: 5px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #24345d;
            border-radius: 22px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        input, select {
            width: 100%;
            background: #1e3a5f;
            border: 1px solid #24345d;
            color: white;
            padding: 14px;
            border-radius: 14px;
            font-size: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        .edit-popup {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .edit-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
        }

        .btn {
            margin-top: 20px;
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-green {
            background: #7bd389;
            color: black;
        }

        .btn-red {
            background: #ff4d4d;
            color: white;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
        }

            .table th, .table td {
                padding: 14px;
                border-bottom: 1px solid #24345d;
                text-align: left;
            }

        .btn-delete {
            background: #ff4d4d;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-edit {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            margin-right: 6px;
        }

        .btn-delete:hover {
            opacity: 0.85;
            transform: scale(1.05);
        }

        .nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            background: #111b35;
            border: 1px solid #24345d;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            padding: 10px;
        }

            .nav button {
                background: none;
                border: none;
                color: white;
                padding: 12px 20px;
                border-radius: 20px;
                cursor: pointer;
            }

        .active {
            background: #2d3b66 !important;
        }

        .hidden {
            display: none;
        }

        .small {
            color: #94a3b8;
            margin-top: 10px;
        }

        @media(max-width:900px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div>
                <div class="logo">🏸 Badminton Host</div>
                <div class="sub">
                </div>
            </div>
        </div>

        <!-- GHI SET -->
        <div id="page-set">

            <div class="card">
                <div class="title">Ghi set mới</div>

                <div class="full-width">
                    <label>Ngày</label>
                    <input type="date" id="date">
                </div>

                <div>
                    <label>Đội A - Người 1</label>
                    <select id="a1"></select>
                </div>

                <div>
                    <label>Đội A - Người 2</label>
                    <select id="a2"></select>
                </div>

                <div>
                    <label>Đội B - Người 1</label>
                    <select id="b1"></select>
                </div>

                <div>
                    <label>Đội B - Người 2</label>
                    <select id="b2"></select>
                </div>

            </div>

            <button class="btn btn-green" onclick="saveSet()">
                Lưu set
            </button>

        </div>

    </div>

    <!-- NGƯỜI CHƠI -->
    <div id="page-player" class="hidden">

        <div class="card">
            <div class="title">Người chơi</div>

            <label>Tên người chơi</label>
            <input type="text" id="playerName" placeholder="Tên người chơi">

            <button class="btn btn-green" onclick="addPlayer()">
                Thêm
            </button>

            <br><br>

            <table class="table">
                <thead>
                    <tr>
                        <th>Tên</th>
                        <th>Xóa</th>
                    </tr>
                </thead>

                <tbody id="playerTable"></tbody>
            </table>

        </div>

    </div>

    <!-- LỊCH SỬ -->
    <div id="page-history" class="hidden">

        <div class="card">
            <div class="title">Lịch sử</div>

            <table class="table">
                <thead>
                    <tr>
                        <th>Ngày</th>
                        <th>Trận</th>
                        <th>Xóa</th>
                    </tr>
                </thead>

                <tbody id="historyTable"></tbody>
            </table>
            <button class="btn btn-red" onclick="clearHistory()">
                Xóa toàn bộ lịch sử
            </button>
        </div>

    </div>

    <!-- THỐNG KÊ -->
    <div id="page-stat" class="hidden">

        <div class="card">
            <div class="title">Thống kê</div>

            <table class="table">
                <thead>
                    <tr>
                        <th>Tên</th>
                        <th>Số Trận</th>
                    </tr>
                </thead>

                <tbody id="statTable"></tbody>
            </table>
            <button class="btn btn-red" onclick="clearAll()">
                Xóa toàn bộ dữ liệu
            </button>

        </div>

    </div>

    </div>

    <!-- NAV -->
    <div class="nav">
        <button class="active" onclick="showPage('set',this)">Ghi set</button>
        <button onclick="showPage('player',this)">Người chơi</button>
        <button onclick="showPage('history',this)">Lịch sử</button>
        <button onclick="showPage('stat',this)">Thống kê</button>
    </div>

    <script>

        let players = JSON.parse(localStorage.getItem("players") || "[]");
        let sets = JSON.parse(localStorage.getItem("sets") || "[]");

        function saveStorage() {
            localStorage.setItem("players", JSON.stringify(players));
            localStorage.setItem("sets", JSON.stringify(sets));
        }

        function showPage(page, btn) {

            document.querySelectorAll(".nav button")
                .forEach(b => b.classList.remove("active"));

            btn.classList.add("active");

            document.getElementById("page-set").classList.add("hidden");
            document.getElementById("page-player").classList.add("hidden");
            document.getElementById("page-history").classList.add("hidden");
            document.getElementById("page-stat").classList.add("hidden");

            document.getElementById("page-" + page)
                .classList.remove("hidden");

            renderAll();
        }
        function showToast(message) {

            let toast =
                document.getElementById("toast");

            toast.innerText = message;

            toast.classList.add("show");

            setTimeout(() => {

                toast.classList.remove("show");

            }, 2000);
        }

        function addPlayer() {

            let name =
                document.getElementById("playerName")
                    .value.trim();

            if (!name) {
                showToast("Nhập Tên");
                return;
            }

            if (players.some(p =>
                p.toLowerCase() === name.toLowerCase()
            )) {
                showToast("⚠️ Tên Người Chơi Đã Tồn Tại");
                return;
            }

            players.push(name);

            saveStorage();

            document.getElementById("playerName").value = "";

            renderAll();
        }

        function deletePlayer(index) {

            players.splice(index, 1);
            showToast("🗑 Đã Xóa Người Chơi");
            saveStorage();

            renderAll();
        }

        function renderPlayers() {

            players.sort((a, b) => a.localeCompare(b));
            let html = "";

            players.forEach((p, i) => {

                html += `
            <tr>
                <td>${p}</td>
                <td>
                    <button class="btn-delete" onclick="deletePlayer(${i})">
                        🗑 Xóa
                    </button>
                </td>
            </tr>
            `;
            });

            document.getElementById("playerTable").innerHTML = html;

            let selects = ["a1", "a2", "b1", "b2"];

            selects.forEach(id => {

                let s = document.getElementById(id);

                s.innerHTML = `<option value="">Không có</option>`;

                players.forEach(p => {

                    s.innerHTML += `
                <option value="${p}">
                    ${p}
                </option>
                `;
                });

            });

        }

        function saveSet() {

            let data = {

                date: document.getElementById("date").value,

                a1: document.getElementById("a1").value,
                a2: document.getElementById("a2").value,

                b1: document.getElementById("b1").value,
                b2: document.getElementById("b2").value
            };

            let allPlayers = [
                data.a1,
                data.a2,
                data.b1,
                data.b2
            ].filter(p => p);

            if (new Set(allPlayers).size !== allPlayers.length) {

                showToast("⚠️ Không Được Chọn Trùng Người Chơi");

                return;
            }

            sets.push(data);

            saveStorage();

            renderAll();

            showToast("🏸 Đã Lưu Trận");
        }

        function renderHistory() {

            let html = "";

            sets.forEach((s, index) => {

                html += `
            <tr>
                <td>${s.date}</td>

                <td>
                    ${s.a1} - ${s.a2}
                    <span style="color:red;font-weight:bold;">VS</span>
                    ${s.b1} - ${s.b2}
                </td>

                <td>

                    <button class="btn-edit"
                        onclick="editSet(${index})">
                        ✏️ Sửa
                    </button>

                    <button class="btn-delete"
                        onclick="deleteSet(${index})">
                        🗑 Xóa
                    </button>

                </td>

            </tr>
            `;
            });

            document.getElementById("historyTable")
                .innerHTML = html;
        }

        function renderStats() {

            let stats = {};

            players.forEach(p => {

                stats[p] = 0;

            });

            sets.forEach(s => {

                let allPlayers = [
                    s.a1,
                    s.a2,
                    s.b1,
                    s.b2
                ];

                allPlayers.forEach(p => {

                    if (p) {
                        stats[p]++;
                    }

                });

            });

            let html = "";

            for (let p in stats) {

                html += `
<tr>
        <td>${p}</td>
        <td>${stats[p]}</td>
</tr>
`;
            }

            document.getElementById("statTable")
                .innerHTML = html;
        }

        function deleteSet(index) {

            if (confirm("Xóa trận này?")) {

                sets.splice(index, 1);
                showToast("🗑 Đã Xóa Trận");
                saveStorage();

                renderAll();
            }
        }

        function editSet(index) {

            let s = sets[index];

            let html = `

<div style="display:flex;flex-direction:column;gap:10px;">

<label>Đội A - Người 1</label>
<select id="editA1">
        ${players.map(p => `
            <option value="${p}"
            ${p === s.a1 ? "selected" : ""}>
                ${p}
            </option>
        `).join("")}
</select>

<label>Đội A - Người 2</label>
<select id="editA2">
        ${players.map(p => `
            <option value="${p}"
            ${p === s.a2 ? "selected" : ""}>
                ${p}
            </option>
        `).join("")}
</select>

<label>Đội B - Người 1</label>
<select id="editB1">
        ${players.map(p => `
            <option value="${p}"
            ${p === s.b1 ? "selected" : ""}>
                ${p}
            </option>
        `).join("")}
</select>

<label>Đội B - Người 2</label>
<select id="editB2">
        ${players.map(p => `
            <option value="${p}"
            ${p === s.b2 ? "selected" : ""}>
                ${p}
            </option>
        `).join("")}
</select>

</div>
`;

            let popup = document.createElement("div");

            popup.innerHTML = `
<div class="edit-popup">

<div class="edit-box">

        <h2>Sửa trận</h2>

        ${html}

        <div style="margin-top:20px;display:flex;gap:10px;">

            <button class="btn-edit"
                onclick="saveEdit(${index})">
                Lưu
            </button>

            <button class="btn-delete"
                onclick="closeEdit()">
                Hủy
            </button>

        </div>

</div>

</div>
`;

            popup.id = "popupEdit";

            document.body.appendChild(popup);
        }

        function saveEdit(index) {

            let a1 =
                document.getElementById("editA1").value;

            let a2 =
                document.getElementById("editA2").value;

            let b1 =
                document.getElementById("editB1").value;

            let b2 =
                document.getElementById("editB2").value;

            let allPlayers = [a1, a2, b1, b2]
                .filter(p => p);

            if (new Set(allPlayers).size !== allPlayers.length) {

                showToast("⚠️ Không Được Chọn Trùng Người Chơi");

                return;
            }

            sets[index].a1 = a1;
            sets[index].a2 = a2;
            sets[index].b1 = b1;
            sets[index].b2 = b2;

            saveStorage();
            showToast("✏️ Đã Cập Nhật Trận");
            renderAll();

            closeEdit();
        }

        function closeEdit() {

            document.getElementById("popupEdit").remove();
        }

        function clearAll() {

            if (confirm("Xóa toàn bộ dữ liệu?")) {

                // Xóa riêng từng dữ liệu
                localStorage.removeItem("players");
                localStorage.removeItem("sets");

                // Reset biến
                players = [];
                sets = [];

                // Render lại giao diện
                renderAll();

                showToast("🗑 Đã Xóa Toàn Bộ Dữ Liệu");
            }
        }

        function clearHistory() {

            if (confirm("Xóa toàn bộ lịch sử trận?")) {

                sets = [];

                localStorage.setItem(
                    "sets",
                    JSON.stringify(sets)
                );

                renderAll();

                showToast("🗑 Đã Xóa Toàn Bộ Lịch Sử");
            }
        }

        function renderAll() {

            renderPlayers();
            renderHistory();
            renderStats();
        }

        document.getElementById("date").valueAsDate =
            new Date();

        renderAll();

    </script>
    <div id="toast"></div>
</body>
</html>
